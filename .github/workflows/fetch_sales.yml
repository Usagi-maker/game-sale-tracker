name: Fetch Sales

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          cat <<EOF > .env
          ITAD_API_KEY=${{ secrets.ITAD_API_KEY }}
          GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          BIGQUERY_DATASET=${{ secrets.BIGQUERY_DATASET }}
          BIGQUERY_TABLE=${{ secrets.BIGQUERY_TABLE }}
          GOOGLE_APPLICATION_CREDENTIALS=gcp-key.json
          EOF

      - name: Create GCP credentials file
        run: echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > gcp-key.json

      - name: Run fetch_sales.py
        run: python fetch_sales.py
